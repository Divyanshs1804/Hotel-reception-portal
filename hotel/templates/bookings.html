<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bookings</title>
  </head>

  <body>
    <h1>All Bookings</h1>

    <table border="1">
      <thead>
        <tr>
          <th>Guest</th>
          <th>Room</th>
          <th>Check In</th>
          <th>Check Out</th>
        </tr>
      </thead>

      <tbody>
        {% for booking in bookings %}

        <tr>
          <td>{{ booking.guest.name }}</td>

          <td>{{ booking.room_number.room_number }}</td>

          <td>{{ booking.check_in }}</td>

          <td>{{ booking.check_out }}</td>
        </tr>

        {% empty %}

        <tr>
          <td colspan="4">No bookings found.</td>
        </tr>

        {% endfor %}
      </tbody>
    </table>

    <br /><br />

    <a href="{% url 'add_booking' %}"> Add New Booking </a>

    <br /><br />

    <a href="{% url 'add_guest' %}"> Add New Guest </a>
  </body>
</html>
