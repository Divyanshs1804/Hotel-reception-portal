<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Add Booking</title>
  </head>

  <body>
    <h1>Create New Booking</h1>

    {% if error %}
    <p>{{ error }}</p>
    {% endif %}

    <form action="{% url 'add_booking' %}" method="post">
      {% csrf_token %}

      <div class="container">
        <label for="guest">
          <b>Guest</b>
        </label>

        <select name="guest" required>
          <option value="">Select Guest</option>

          {% for guest in guests %}

          <option value="{{ guest.id }}">{{ guest.name }}</option>

          {% endfor %}
        </select>

        <br /><br />

        <label for="room">
          <b>Room</b>
        </label>

        <select name="room" required>
          <option value="">Select Room</option>

          {% for room in rooms %}

          <option value="{{ room.id }}">Room {{ room.room_number }}</option>

          {% endfor %}
        </select>

        <br /><br />

        <label for="check_in">
          <b>Check In</b>
        </label>

        <input
          type="date"
          name="check_in"
          min="{{ today|date:'Y-m-d' }}"
          required
        />

        <br /><br />

        <label for="check_out">
          <b>Check Out</b>
        </label>

        <input
          type="date"
          name="check_out"
          min="{{ today|date:'Y-m-d' }}"
          required
        />

        <br /><br />

        <button type="submit">Create Booking</button>
      </div>
    </form>

    <br />

    <a href="{% url 'booking' %}"> View All Bookings </a>

    <br /><br />

    <a href="{% url 'add_guest' %}"> Add New Guest </a>
  </body>
</html>
